name: Daily Trading Intelligence Digest

on:
  schedule:
    # BST Window (09:00 - 10:00 BST = 08:00 - 09:00 UTC)
    # Multi-tick 15-minute retry intervals to eliminate GitHub runner queue delays:
    - cron: '5 8 * * *'    # 09:05 BST (Primary target)
    - cron: '20 8 * * *'   # 09:20 BST (Fallback 1)
    - cron: '35 8 * * *'   # 09:35 BST (Fallback 2)
    - cron: '50 8 * * *'   # 09:50 BST (Fallback 3)
    # GMT Window (09:00 - 10:00 GMT = 09:00 - 10:00 UTC)
    - cron: '5 9 * * *'    # 09:05 GMT (Winter primary target)
    - cron: '20 9 * * *'   # 09:20 GMT (Winter fallback 1)
    - cron: '35 9 * * *'   # 09:35 GMT (Winter fallback 2)
    - cron: '50 9 * * *'   # 09:50 GMT (Winter fallback 3)
    # Late morning safety catch-all
    - cron: '5 10 * * *'   # 11:05 BST / 10:05 GMT catch-all
  workflow_dispatch: # Manual one-click run from the GitHub UI, and the optional external 09:00 Europe/London scheduler (see README)
    inputs:
      force:
        description: "Force a re-send even if today's digest was already emailed"
        type: boolean
        required: false
        default: false

# Serialise runs: two ticks (or a tick plus an external dispatch) can never send or push at the same time.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: London date (keys the once-a-day failure alert)
        id: london
        run: echo "date=$(TZ=Europe/London date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Timezone & Deduplication Gatekeeper (Ensure 09:00 London Time, exactly 1 run daily)
        id: time_gate
        env:
          FORCE_INPUT: ${{ github.event.inputs.force }}
          T212_KEY_ID: ${{ secrets.T212_KEY_ID }}
          T212_KEY_ID_2: ${{ secrets.T212_KEY_ID_2 }}
        run: |
          # A repository with no Trading 212 key (this template itself, or a fork not set up yet) has nothing to
          # analyse: skip cleanly so the run is green and GitHub sends no "Run failed" emails. A partly configured
          # repository (a key but no secret) still fails loudly in main.py.
          if [ -z "$T212_KEY_ID" ] && [ -z "$T212_KEY_ID_2" ]; then
            echo "::notice title=Digest skipped::No Trading 212 API key in this repository's secrets (T212_KEY_ID / T212_KEY_ID_2). Add your secrets (see README) to turn the daily digest on."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Read the sent-marker from the freshest origin/main (another run may have pushed since checkout).
          git fetch origin main
          MARKER_JSON=$(git show origin/main:data/last_email_sent.json 2>/dev/null) || MARKER_JSON='{}'
          echo "Sent-marker on origin/main: $MARKER_JSON"
          ALREADY_SENT=$(printf '%s' "$MARKER_JSON" | python -c "import json, sys, datetime, zoneinfo; today = datetime.datetime.now(zoneinfo.ZoneInfo('Europe/London')).strftime('%Y-%m-%d'); raw = sys.stdin.read().strip(); d = json.loads(raw) if raw else {}; print('yes' if isinstance(d, dict) and d.get('date') == today else 'no')") || ALREADY_SENT="no"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$FORCE_INPUT" = "true" ]; then
              echo "Dispatch with force=true: bypassing the time gate and the daily dedupe."
              echo "proceed=true" >> $GITHUB_OUTPUT
            elif [ "$ALREADY_SENT" = "yes" ]; then
              echo "Dispatch: today's digest has already been sent. Skipping duplicate (dispatch with force=true to override)."
              echo "proceed=false" >> $GITHUB_OUTPUT
            else
              echo "Dispatch: no digest sent yet today. Proceeding (time gate not applied to dispatches)."
              echo "proceed=true" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          LONDON_HOUR=$(python -c 'from datetime import datetime; import zoneinfo; print(datetime.now(zoneinfo.ZoneInfo("Europe/London")).hour)')
          echo "Current Europe/London hour: $LONDON_HOUR"

          if [ "$LONDON_HOUR" -lt 9 ]; then
            echo "Too early for morning run (London hour $LONDON_HOUR < 9). Skipping."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$ALREADY_SENT" = "yes" ]; then
            echo "Today digest has already been sent. Skipping duplicate run."
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "London hour $LONDON_HOUR >= 9 and no digest sent yet today. Proceeding with daily digest."
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run offline unit tests (job fails before any email if these fail)
        id: tests
        if: steps.time_gate.outputs.proceed == 'true'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p logs
          python -m unittest discover -s tests -v 2>&1 | tee logs/unit_tests.log

      - name: Run Daily Portfolio Analysis & Dispatch Email
        id: digest
        if: steps.time_gate.outputs.proceed == 'true'
        env:
          ACCOUNT_NAME: ${{ secrets.ACCOUNT_NAME }}
          T212_KEY_ID: ${{ secrets.T212_KEY_ID }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
          T212_ENV: ${{ secrets.T212_ENV }}
          MIN_CASH_RESERVE_GBP: ${{ secrets.MIN_CASH_RESERVE_GBP }}
          EXCLUDED_TICKERS: ${{ secrets.EXCLUDED_TICKERS }}
          SECOND_ACCOUNT_NAME: ${{ secrets.SECOND_ACCOUNT_NAME }}
          T212_KEY_ID_2: ${{ secrets.T212_KEY_ID_2 }}
          T212_SECRET_2: ${{ secrets.T212_SECRET_2 }}
          MIN_CASH_RESERVE_2: ${{ secrets.MIN_CASH_RESERVE_2 }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          # Optional settings (see README "Optional settings"); unset secrets keep the generic defaults
          EARMARKED_TICKERS: ${{ secrets.EARMARKED_TICKERS }}
          OUTSIDE_HOLDINGS_JSON: ${{ secrets.OUTSIDE_HOLDINGS_JSON }}
          RESERVE_TOPUPS_JSON: ${{ secrets.RESERVE_TOPUPS_JSON }}
          MAX_LEVERAGED_ETF_PCT: ${{ secrets.MAX_LEVERAGED_ETF_PCT }}
          ACCOUNT_WRAPPER: ${{ secrets.ACCOUNT_WRAPPER }}
          ACCOUNT_WRAPPER_2: ${{ secrets.ACCOUNT_WRAPPER_2 }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Output is also written to logs/ (gitignored, never committed) so a failure alert can quote it.
          set -o pipefail
          mkdir -p logs
          if [ "$FORCE_INPUT" = "true" ]; then
            python main.py --force 2>&1 | tee logs/digest_run.log
          else
            python main.py 2>&1 | tee logs/digest_run.log
          fi

      - name: Commit updated snapshots, history, and dashboard
        id: commit
        if: steps.time_gate.outputs.proceed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard.html
          git commit -m "chore: automated daily snapshot & dashboard update [skip ci]" || exit 0
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "Pushed snapshot commit on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; aborting any in-progress rebase and retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Failed to push after 3 attempts."
          exit 1

      # ---- Failure path: a failed run is never silent (at most one alert email per London day) ----
      - name: Check whether today's failure alert was already emailed
        id: alert_seen
        if: failure()
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .failure-alert
          key: failure-alert-${{ steps.london.outputs.date }}
          lookup-only: true

      - name: Email a failure alert (failed stage, log tail and a link to this run)
        id: alert
        if: failure() && steps.alert_seen.outputs.cache-hit != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          OUTCOME_TESTS: ${{ steps.tests.outcome }}
          OUTCOME_DIGEST: ${{ steps.digest.outcome }}
          OUTCOME_COMMIT: ${{ steps.commit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: python3 scripts/failure_alert.py

      - name: Remember that today's failure alert was emailed
        if: failure() && steps.alert.outputs.sent == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .failure-alert
          key: failure-alert-${{ steps.london.outputs.date }}
